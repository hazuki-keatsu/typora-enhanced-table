<!doctype html>
<meta charset="utf-8">
<title>Enhanced table behavior tests</title>
<pre id="result">Running…</pre>
<script type="module">
import { mergeCells, splitCell, tableGrid } from '../.test-dist/table.js'
let passed = 0
function assert(condition, message) { if (!condition) throw Error(message); passed++ }
function table(html) { const div = document.createElement('div'); div.innerHTML = `<table>${html}</table>`; return div.firstElementChild }
function rejects(action, message) { let failed = false; try { action() } catch { failed = true } assert(failed, message) }
try {
  const t = table('<tbody><tr><td>A</td><td>B</td></tr><tr><td>C</td><td>D</td></tr></tbody>')
  const merged = mergeCells(t, Array.from(t.querySelectorAll('td')))
  assert(merged.rowSpan === 2 && merged.colSpan === 2, 'rectangular merge uses both spans')
  assert(merged.innerHTML === 'AB<br>CD', 'horizontal content stays on its row')
  assert(merged.textContent === 'ABCD', 'merge preserves all content in document order')
  assert(t.rows[1].cells.length === 0, 'covered cells removed')
  splitCell(t, merged)
  assert(t.rows[0].cells.length === 2 && t.rows[1].cells.length === 2, 'split restores all slots')
  assert(t.rows[0].cells[0].textContent === 'ABCD', 'split keeps content in first cell')
  assert(tableGrid(t).length === 4, 'split grid remains valid')
  rejects(() => mergeCells(t, [t.rows[0].cells[0], t.rows[1].cells[1]]), 'diagonal selection refused')
  const groups = table('<thead><tr><th>A</th></tr></thead><tbody><tr><td>B</td></tr></tbody>')
  rejects(() => mergeCells(groups, Array.from(groups.querySelectorAll('th,td'))), 'cross-section merge refused')
  const spans = table('<tbody><tr><td rowspan="2">A</td><td>B</td><td>C</td></tr><tr><td>D</td><td>E</td></tr></tbody>')
  rejects(() => mergeCells(spans, [spans.rows[0].cells[0], spans.rows[0].cells[1]]), 'incomplete existing-span rectangle refused')
  const nested = mergeCells(spans, [spans.rows[0].cells[0], spans.rows[0].cells[1], spans.rows[1].cells[0]])
  assert(nested.rowSpan === 2 && nested.colSpan === 2, 'existing span can merge in complete rectangle')
  splitCell(spans, nested)
  assert(spans.rows[0].cells[2].textContent === 'C' && spans.rows[1].cells[2].textContent === 'E', 'split preserves order around existing cells')
  const zero = table('<tbody><tr><td rowspan="0">A</td><td>B</td></tr><tr><td>C</td></tr></tbody>')
  assert(tableGrid(zero)[0].bottom === 1, 'rowspan zero extends to group end')
  splitCell(zero, zero.rows[0].cells[0])
  assert(zero.rows[1].cells.length === 2, 'rowspan zero splits')
  const horizontal = table('<tbody><tr><td><strong>A</strong><br>B</td><td><em>C</em></td><td></td></tr></tbody>')
  assert(mergeCells(horizontal, Array.from(horizontal.querySelectorAll('td'))).innerHTML === '<strong>A</strong><br>B<em>C</em>', 'horizontal merge keeps existing markup and adds no newline')
  const vertical = table('<tbody><tr><td>A</td></tr><tr><td></td></tr><tr><td>C</td></tr></tbody>')
  assert(mergeCells(vertical, Array.from(vertical.querySelectorAll('td'))).innerHTML === 'A<br><br>C', 'vertical merge preserves empty row boundaries')
  document.querySelector('#result').textContent = `PASS ${passed} assertions`
  window.testResult = { passed }
} catch (error) {
  document.querySelector('#result').textContent = `FAIL ${error.stack}`
  window.testResult = { error: String(error) }
  throw error
}
</script>
